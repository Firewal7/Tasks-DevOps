---
# roles/clickhouse/tasks/main.yml

- name: Установить необходимые пакеты
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - dirmngr
      - gnupg
      - curl
    state: present

- name: Download and add ClickHouse GPG key
  ansible.builtin.shell: |
    curl -fsSL 'https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key' | gpg --dearmor -o /usr/share/keyrings/clickhouse-keyring.gpg
  args:
    creates: /usr/share/keyrings/clickhouse-keyring.gpg

- name: Add ClickHouse repository to sources list
  ansible.builtin.shell: |
    echo "deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg] https://packages.clickhouse.com/deb stable main" | tee /etc/apt/sources.list.d/clickhouse.list
  args:
    creates: /etc/apt/sources.list.d/clickhouse.list

- name: Установить ClickHouse
  apt:
    name:
      - "clickhouse-server={{ clickhouse_version }}"
      - "clickhouse-client={{ clickhouse_version }}"
    state: present

- name: Запустить сервис ClickHouse
  ansible.builtin.systemd:
    name: clickhouse-server
    state: started
    enabled: yes

- name: Создать директорию для кастомных конфигураций
  file:
    path: "/etc/clickhouse-server/config.d"
    state: directory
    owner: clickhouse
    group: clickhouse

- name: Создать кастомный конфигурационный файл
  template:
    src: "custom_config.xml.j2"
    dest: "/etc/clickhouse-server/config.d/custom_config.xml"
    owner: clickhouse
    group: clickhouse

- name: Создать базу данных kafka_data
  shell: |
    clickhouse-client --host {{ clickhouse_host }} --port {{ clickhouse_port }} --user default --password '' --query "
      CREATE DATABASE IF NOT EXISTS kafka_data;
    "
  args:
    executable: /bin/bash

- name: Создать таблицу kafka_messages
  shell: |
    clickhouse-client --host {{ clickhouse_host }} --port {{ clickhouse_port }} --user default --password '' --query "
      CREATE TABLE IF NOT EXISTS kafka_data.kafka_messages (
          key String,
          value String,
          timestamp DateTime
      ) ENGINE = MergeTree()
      ORDER BY timestamp;
    "
  args:
    executable: /bin/bash

- name: Создать таблицу kafka_raw для чтения данных из Kafka
  shell: |
    clickhouse-client --host {{ clickhouse_host }} --port {{ clickhouse_port }} --user default --password '' --query "
      CREATE TABLE IF NOT EXISTS kafka_data.kafka_raw (
          key String,
          value String,
          timestamp DateTime
      ) ENGINE = Kafka
      SETTINGS kafka_broker_list = '{{ kafka_broker_list }}',
               kafka_topic_list = '{{ kafka_topic }}',
               kafka_group_name = '{{ kafka_group_name }}',
               kafka_format = 'JSONEachRow',
               kafka_num_consumers = 1;"
  args:
    executable: /bin/bash

- name: Создать материализованное представление kafka_to_table
  shell: |
    clickhouse-client --host {{ clickhouse_host }} --port {{ clickhouse_port }} --user default --password '' --query "
      CREATE MATERIALIZED VIEW IF NOT EXISTS kafka_data.kafka_to_table
      TO kafka_data.kafka_messages
      AS SELECT
          key,
          value,
          now() AS timestamp
      FROM kafka_data.kafka_raw;
    "
  args:
    executable: /bin/bash
