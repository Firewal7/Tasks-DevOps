---
- name: Устанавливаем необходимые пакеты (с ретраями при lock)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - dirmngr
      - gnupg
      - curl
    state: present
    update_cache: true
    lock_timeout: 300
  register: apt_result
  retries: 5
  delay: 15
  until: apt_result is succeeded

- name: Скачиваем ключ ClickHouse
  ansible.builtin.get_url:
    url: "https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key"
    dest: /tmp/clickhouse.key
    mode: "0644"

- name: Конвертируем ключ в keyring
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/clickhouse-keyring.gpg /tmp/clickhouse.key
    creates: /usr/share/keyrings/clickhouse-keyring.gpg

- name: Добавляем репозиторий ClickHouse
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg] https://packages.clickhouse.com/deb stable main"
    filename: clickhouse
    state: present
    update_cache: true

- name: Устанавливаем ClickHouse
  ansible.builtin.apt:
    name:
      - "clickhouse-server={{ clickhouse_version }}"
      - "clickhouse-client={{ clickhouse_version }}"
      - "clickhouse-common-static={{ clickhouse_version }}"
    state: present

- name: Запускаем и включаем ClickHouse
  ansible.builtin.systemd:
    name: clickhouse-server
    state: started
    enabled: true

- name: Рендерим SQL-шаблон
  ansible.builtin.template:
    src: database.sql.j2
    dest: /tmp/database.sql
    mode: "0600"
  when: clickhouse_user is defined and clickhouse_password is defined

- name: Применяем SQL в ClickHouse
  ansible.builtin.command:
    argv:
      - clickhouse-client
      - --host
      - "{{ clickhouse_host }}"
      - --port
      - "{{ clickhouse_port | string }}"
      - --user
      - "{{ clickhouse_user }}"
      - --password
      - "{{ clickhouse_password }}"
      - --multiquery
  args:
    stdin: "{{ lookup('template', 'database.sql.j2') }}"
  no_log: true
  when: clickhouse_user is defined and clickhouse_password is defined