---
# Базовая конфигурация Kafka в режиме KRaft
kafka_version: "3.9.2"
kafka_scala_version: "2.13"

kafka_advertised_host: "{{ ansible_host }}"
kafka_controller_bind_address: "127.0.0.1"

kafka_bootstrap_server: "localhost:9092"
kafka_topic_name: "test-topic"
kafka_topic_partitions: 3
kafka_topic_replication_factor: 3

kafka_brokers:
  - id: 1
    broker_port: 9092
    controller_port: 9093
    log_dir: "/var/lib/kafka/kraft-1"
  - id: 2
    broker_port: 9094
    controller_port: 9095
    log_dir: "/var/lib/kafka/kraft-2"
  - id: 3
    broker_port: 9096
    controller_port: 9097
    log_dir: "/var/lib/kafka/kraft-3"
