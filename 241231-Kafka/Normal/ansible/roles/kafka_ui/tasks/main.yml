---
- name: Обновляем список пакетов
  ansible.builtin.apt:
    update_cache: yes

- name: Устанавливаем Docker
  ansible.builtin.apt:
    name: docker.io
    state: present

- name: Образ Kafka UI
  community.docker.docker_image:
    name: provectuslabs/kafka-ui
    tag: "{{ kafka_ui_image_tag }}"
    source: pull

- name: Контейнер Kafka UI
  community.docker.docker_container:
    name: kafka-ui
    image: "provectuslabs/kafka-ui:{{ kafka_ui_image_tag }}"
    state: started
    restart_policy: always
    ports:
      - "{{ kafka_ui_external_port }}:{{ kafka_ui_internal_port }}"
    env:
      KAFKA_CLUSTERS_0_NAME: "{{ kafka_cluster_name }}"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "{{ kafka_bootstrap_servers }}"
